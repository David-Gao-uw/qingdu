<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>清读</title>
<style>
/* Layout: one iPhone on a quiet page. Camera → the notice zooms into a reading view; a single glass slider drives a typographic hierarchy (key up, minor down). AI moments use the edge glow, Dynamic Island and a light sweep. */
@property --a { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
:root {
  --page: #F5F5F7;
  --bg: #FFFFFF;
  --grouped: #F2F2F7;
  --cell: #FFFFFF;
  --label: #000000;
  --label2: rgba(60,60,67,.6);
  --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18);
  --fill: rgba(118,118,128,.12);
  --blue: #007AFF;
  --red: #FF3B30;
  --green: #30D158;
  --paper: #F8F6EF;
  --print-ink: #45403A;
  --glass: rgba(255,255,255,.72);
  --glass-edge: rgba(255,255,255,.75);
  --glass-shadow: 0 10px 30px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
  --seg-pill: #FFFFFF;
  --key-card: rgba(255,59,48,.08);
  --time-chip: rgba(118,118,128,.14);
  --bezel: #1C1C1E;
  --bezel-edge: #3A3A3C;
  --sweep-blend: screen;
  /* Apple Intelligence palette */
  --ai1: #8D9FFF; --ai2: #BC82F3; --ai3: #F5B9EA; --ai4: #FF6778; --ai5: #FFBA71; --ai6: #C686FF;
  /* camera world is a photo: the same in both themes */
  --cam: #000000;
  --cam-ink: #FFFFFF;
  --cam-yellow: #FFD60A;
  --photo-paper: #F6F3EA;
  --photo-ink: #2B2724;
  --f-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --f-print: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #000000; --bg: #000000; --grouped: #000000; --cell: #1C1C1E;
    --label: #FFFFFF; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24);
    --blue: #0A84FF; --red: #FF453A; --green: #30D158; --paper: #1B1A17; --print-ink: #B8B2A6;
    --glass: rgba(37,37,40,.72); --glass-edge: rgba(255,255,255,.12); --glass-shadow: 0 10px 30px rgba(0,0,0,.5);
    --seg-pill: #636366; --key-card: rgba(255,69,58,.16); --time-chip: rgba(118,118,128,.3);
    --bezel: #1C1C1E; --bezel-edge: #48484A; --sweep-blend: multiply;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #000000; --bg: #000000; --grouped: #000000; --cell: #1C1C1E;
  --label: #FFFFFF; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24);
  --blue: #0A84FF; --red: #FF453A; --green: #30D158; --paper: #1B1A17; --print-ink: #B8B2A6;
  --glass: rgba(37,37,40,.72); --glass-edge: rgba(255,255,255,.12); --glass-shadow: 0 10px 30px rgba(0,0,0,.5);
  --seg-pill: #636366; --key-card: rgba(255,69,58,.16); --time-chip: rgba(118,118,128,.3);
  --bezel: #1C1C1E; --bezel-edge: #48484A; --sweep-blend: multiply;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--label);
  font-family: var(--f-sans); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }

/* ---------- stage & ambient light ---------- */
.stage { position: relative; isolation: isolate; overflow: clip; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-block: 24px; box-sizing: border-box; }
.ambient {
  position: absolute; left: 50%; top: 50%; width: 980px; height: 980px; margin: -490px 0 0 -490px; z-index: -1; pointer-events: none;
  background:
    radial-gradient(closest-side at 34% 38%, color-mix(in srgb, var(--ai2) 60%, transparent), transparent),
    radial-gradient(closest-side at 68% 44%, color-mix(in srgb, var(--ai4) 50%, transparent), transparent),
    radial-gradient(closest-side at 46% 70%, color-mix(in srgb, var(--ai1) 55%, transparent), transparent),
    radial-gradient(closest-side at 60% 28%, color-mix(in srgb, var(--ai5) 45%, transparent), transparent);
  filter: blur(50px); opacity: 0; transform: scale(.85);
  transition: opacity 1.2s ease, transform 1.6s cubic-bezier(.2,.8,.2,1);
}
.stage.glowing .ambient { opacity: 1; transform: scale(1); }
.stage.ai-layer:not(.glowing) .ambient { opacity: .32; transform: scale(.95); }

/* ---------- device ---------- */
.dev-wrap { position: relative; }
.device {
  --status: 54px; --home: 21px; --t: 0; --h: 0; --screen-r: 45px;
  position: absolute; left: 0; top: 0; width: 393px; height: 852px; transform-origin: 0 0;
  border-radius: 56px; background: var(--bezel);
  box-shadow: 0 0 0 1.5px var(--bezel-edge), 0 40px 80px rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.10);
  padding: 11px; box-sizing: content-box;
}
.screen { position: relative; width: 100%; height: 100%; border-radius: var(--screen-r); overflow: hidden; background: var(--bg); isolation: isolate; }
.statusbar {
  position: absolute; z-index: 29; top: 0; left: 0; right: 0; height: var(--status);
  display: flex; align-items: center; justify-content: space-between; padding: 4px 34px 0 46px; box-sizing: border-box;
  font-size: 16px; font-weight: 600; color: var(--label); transition: color .4s; pointer-events: none;
}
.statusbar svg { display: block; }
.status-r { display: flex; gap: 6px; align-items: center; }
.homebar { position: absolute; z-index: 29; bottom: 8px; left: 50%; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px; background: var(--label); transition: background .4s; pointer-events: none; }
.is-cam .statusbar { color: var(--cam-ink); }
.is-cam .homebar { background: var(--cam-ink); }
.caption { margin: 0; font-size: 13px; color: var(--label2); text-align: center; }
.caption kbd { font-family: inherit; font-size: 12px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--sep); background: var(--bg); }

/* ---------- Dynamic Island ---------- */
.island { position: absolute; z-index: 30; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; overflow: hidden; }
.isl-in { position: absolute; inset: 0; display: flex; align-items: center; gap: 12px; padding: 0 18px 0 14px; opacity: 0; color: #fff; }
.isl-icon { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); }
.isl-icon svg { animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: rotate(45deg) scale(.86); } }
.isl-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.isl-text b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.isl-text small { font-size: 12px; color: rgba(255,255,255,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.isl-right { flex: none; width: 28px; height: 28px; display: grid; place-items: center; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.22); border-top-color: #fff; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.done-ic { width: 26px; height: 26px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }

/* ---------- Apple Intelligence edge glow & light sweep ---------- */
.ai-glow { position: absolute; inset: 0; z-index: 27; pointer-events: none; opacity: 0; transition: opacity .6s ease; animation: spinA 3.2s linear infinite; animation-play-state: paused; }
.ai-on .ai-glow { opacity: 1; animation-play-state: running; }
@keyframes spinA { to { --a: 360deg; } }
.ring, .halo > i {
  position: absolute; inset: 0; border-radius: var(--screen-r);
  background: conic-gradient(from var(--a), var(--ai2), var(--ai3), var(--ai1), var(--ai6), var(--ai4), var(--ai5), var(--ai2));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.ring { padding: 3px; filter: blur(1px); }
.halo { position: absolute; inset: 0; filter: blur(16px); }
.halo > i { padding: 16px; }
.sweep {
  position: absolute; left: 0; right: 0; top: 0; height: 260px; z-index: 4; pointer-events: none; opacity: 0;
  mix-blend-mode: var(--sweep-blend);
  background: linear-gradient(to bottom, transparent 0%, var(--ai1) 24%, var(--ai2) 42%, var(--ai4) 62%, var(--ai5) 80%, transparent 100%);
}

/* ---------- camera ---------- */
.cam { position: absolute; inset: 0; background: var(--cam); color: var(--cam-ink); transition: opacity .45s ease; }
.is-reader .cam { opacity: 0; pointer-events: none; }
.cam-top { position: absolute; top: var(--status); left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; }
.viewfinder {
  position: absolute; left: 0; right: 0; top: calc(var(--status) + 44px); bottom: 178px; overflow: hidden;
  background: radial-gradient(120% 85% at 50% 45%, #3B352E 0%, #1C1A17 58%, #0B0A09 100%);
}
.shot { position: absolute; left: 0; width: 100%; top: 50%; transform: translateY(-50%) rotate(-2.2deg) scale(.56); transform-origin: 50% 50%; }
.shot::after {
  content: ""; position: absolute; inset: -14px; border: 4px solid var(--cam-yellow); border-radius: 14px;
  animation: detect 1.8s ease-in-out infinite; pointer-events: none;
}
@keyframes detect { 50% { opacity: .45; } }
.found-pill { position: absolute; z-index: 2; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 99px; background: rgba(0,0,0,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; white-space: nowrap; }
.found-pill i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--cam-yellow); margin-right: 7px; vertical-align: 1px; }
.cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 178px; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 16px; box-sizing: border-box; }
.modes { display: flex; gap: 22px; font-size: 13px; letter-spacing: .04em; color: rgba(255,255,255,.75); }
.modes b { color: var(--cam-yellow); font-weight: 600; }
.shutter { width: 72px; height: 72px; border-radius: 50%; border: 0; padding: 0; background: var(--cam-ink); box-shadow: 0 0 0 3px var(--cam), 0 0 0 6px var(--cam-ink); cursor: pointer; transition: transform .12s ease; }
.shutter:active { transform: scale(.9); }
.shutter:focus-visible { outline: 3px solid var(--cam-yellow); outline-offset: 8px; }
.flash { position: absolute; inset: 0; z-index: 40; background: #fff; opacity: 0; pointer-events: none; }

/* ---------- reader ---------- */
.rd { position: absolute; inset: 0; z-index: 1; visibility: hidden; }
.is-reader .rd { visibility: visible; }
.pane {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  padding-top: calc(var(--status) + 92px); padding-bottom: calc(var(--home) + 150px); box-sizing: border-box;
  transition: opacity .25s ease, background-color .45s ease;
}
.pane::-webkit-scrollbar { display: none; }
.pane[aria-hidden="true"] { opacity: 0; pointer-events: none; }
.pane-doc { background: var(--paper); background: color-mix(in srgb, var(--bg) calc(var(--t) * 100%), var(--paper)); }
.is-cam .pane-doc { background: transparent; }
.pane-list { background: var(--grouped); }

.nav, .dock {
  position: absolute; z-index: 5; left: 0; right: 0;
  background: var(--glass); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  opacity: 0; transition: opacity .4s ease, transform .55s cubic-bezier(.2,.8,.2,1);
}
.nav { top: 0; padding-top: var(--status); box-shadow: 0 .5px 0 var(--sep); transform: translateY(-24px); }
.dock {
  left: 10px; right: 10px; bottom: calc(var(--home) + 10px); border-radius: 30px;
  box-shadow: var(--glass-shadow), inset 0 0 0 .5px var(--glass-edge);
  padding: 12px 18px 14px; transform: translateY(30px);
}
.is-reader .nav, .is-reader .dock { opacity: 1; transform: none; transition-delay: .25s; }
.nav-row { height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; }
.back { justify-self: start; display: flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--blue); font-size: 17px; cursor: pointer; padding: 6px 4px; }
.nav-title { font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.icon-btn { justify-self: end; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--blue); cursor: pointer; border-radius: 50%; }
.icon-btn:active, .back:active { opacity: .5; }
.seg { position: relative; margin: 2px 16px 10px; height: 32px; padding: 2px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 9px; }
.seg button { position: relative; z-index: 1; border: 0; background: none; font-size: 13px; font-weight: 500; cursor: pointer; }
.seg button[aria-selected="true"] { font-weight: 600; }
.seg-pill { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: 7px; background: var(--seg-pill); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); transition: transform .32s cubic-bezier(.3,.8,.3,1); }
.seg[data-i="1"] .seg-pill { transform: translateX(100%); }

.dock-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 13px; color: var(--label2); }
.dock-top b { color: var(--label); font-weight: 600; font-size: 15px; }
.dock-top b.ai { background: linear-gradient(90deg, var(--ai1), var(--ai2), var(--ai4), var(--ai5)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dock-top span { font-variant-numeric: tabular-nums; }
.slider-row { display: flex; align-items: center; gap: 12px; }
.a-sm, .a-lg { color: var(--label); font-weight: 500; line-height: 1; }
.a-sm { font-size: 13px; }
.a-lg { font-size: 23px; }
.range-wrap { position: relative; flex: 1; height: 30px; }
#level { position: absolute; inset: 0; width: 100%; height: 30px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
#level::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--blue) calc(var(--t) * 100%), var(--fill) 0); }
#level::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -12px; border-radius: 50%; background: #fff; box-shadow: 0 .5px 4px rgba(0,0,0,.12), 0 6px 13px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
#level::-moz-range-track { height: 4px; border-radius: 2px; background: var(--fill); }
#level::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--blue); }
#level::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 .5px 4px rgba(0,0,0,.12), 0 6px 13px rgba(0,0,0,.12); }
#level:focus-visible { outline: none; }
#level:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 35%, transparent), 0 6px 13px rgba(0,0,0,.12); }

/* ---------- the document ---------- */
#paper { width: 100%; box-sizing: border-box; padding: 24px 22px 32px; transition: background-color .5s ease, box-shadow .5s ease; }
#paper.photo { background: linear-gradient(176deg, var(--photo-paper), #EEEADF); box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.3); }
.doc {
  font-family: var(--f-print);
  font-size: calc(13px + 7px * var(--t));
  line-height: calc(1.55 + .3 * var(--t));
  letter-spacing: calc(.05em * var(--t));
  color: var(--label);
  color: color-mix(in srgb, var(--label) calc(var(--t) * 100%), var(--print-ink));
  transition: color .5s ease;
}
#paper.photo .doc { color: var(--photo-ink); }
.doc.sans { font-family: var(--f-sans); }
.d-head { text-align: center; padding-bottom: .7em; margin-bottom: .9em; border-bottom: 1px solid var(--sep); }
#paper.photo .d-head { border-bottom-color: rgba(0,0,0,.2); }
.doc.lines .d-head { text-align: left; border-bottom-color: transparent; padding-bottom: 0; }
.d-org { margin: 0; font-size: .78em; letter-spacing: .15em; opacity: .7; }
.d-title { margin: .2em 0 0; font-size: 1.38em; line-height: 1.35; font-weight: 700; letter-spacing: .06em; }
.doc.lines .d-title { font-size: calc(1.38em + .14em * var(--h)); letter-spacing: .01em; }
.d-h { margin: .8em 0 .1em; font-size: 1em; font-weight: 700; }
.doc.lines .d-h { margin: 1.5em 0 .35em; font-size: .76em; font-weight: 600; letter-spacing: .08em; color: var(--label2); }
.d-p { margin: 0; text-indent: 2em; }
.doc.lines .d-p { text-indent: 0; display: flex; flex-direction: column; gap: .55em; }
.w { display: inline-block; white-space: nowrap; text-indent: 0; }
.s { border-radius: 14px; transition: opacity .45s ease, background-color .45s ease; }
/* hierarchy: from the 一句一行 stage on, key sentences grow and minor ones recede, continuously with the slider */
.doc.lines .s.lo { opacity: calc(1 - .68 * var(--h)); font-size: calc(1em - .24em * var(--h)); line-height: calc(1.85 - .3 * var(--h)); cursor: pointer; }
.doc.lines .s.lo.show { opacity: 1; }
.doc.lines .s.key { font-size: calc(1em + .14em * var(--h)); }
.doc.marks .s.key { font-weight: 500; background: var(--key-card); padding: .5em .7em; margin: .15em -.7em; }
.mk { border-radius: 6px; transition: color .35s ease, background-color .35s ease, text-shadow .35s ease; }
.doc.marks .k.neg .mk { color: var(--red); font-weight: 700; }
.doc.marks .k.time .mk { font-weight: 600; background: var(--time-chip); padding: 0 .22em; margin: 0 .06em; font-variant-numeric: tabular-nums; }
.doc.marks .k.item .mk { font-weight: 600; }
.mk.found { color: var(--red); text-shadow: 0 0 14px color-mix(in srgb, var(--red) 55%, transparent); }
.s.reading { background: color-mix(in srgb, var(--blue) 15%, transparent); }
.s.ping { animation: ping 1.6s ease-out; }
@keyframes ping { 0%, 40% { background: color-mix(in srgb, var(--blue) 18%, transparent); } 100% { background: transparent; } }
.foot { margin: 28px 22px 0; font-size: 12px; color: var(--label2); text-align: center; }

/* ---------- 要点 list ---------- */
.list { padding: 6px 16px 0; font-size: calc(17px + 3px * var(--t)); }
.list-title { margin: 4px 4px 2px; font-size: 1.6em; font-weight: 700; letter-spacing: .01em; }
.list-sub { margin: 0 4px; font-size: .8em; color: var(--label2); }
.group-h { margin: 22px 16px 7px; font-size: .76em; color: var(--label2); }
.group { background: var(--cell); border-radius: 12px; overflow: hidden; }
.row { position: relative; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 12px 12px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 54px; right: 0; height: .5px; background: var(--sep); }
.row:active, .row.speaking { background: var(--fill); }
.row:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; border-radius: 12px; }
.ic { width: 28px; height: 28px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--label3); font-size: 16px; font-weight: 700; }
.row.warn .ic { background: var(--red); }
.when { font-size: .82em; font-weight: 600; color: var(--label2); font-variant-numeric: tabular-nums; }
.row.warn .when { color: var(--red); }
.what { display: block; margin-top: 1px; font-size: 1em; line-height: 1.4; }
.what b { color: var(--red); font-weight: 600; }
.chev { align-self: center; color: var(--label3); }

/* ---------- phone: the page is the device ---------- */
@media (max-width: 500px) {
  body { padding: 0; }
  .stage { padding: 0; height: 100%; }
  .caption, .statusbar, .homebar, .ambient { display: none; }
  .island { top: 8px; display: none; }
  .island.live { display: block; }
  .dev-wrap { width: 100% !important; height: 100% !important; }
  .device { --status: 8px; --home: 4px; --screen-r: 0px; position: relative; width: 100%; height: 100%; padding: 0; border-radius: 0; box-shadow: none; transform: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  .shot::after, .isl-icon svg, .ai-glow { animation: none; }
}
</style>

<div class="stage" id="stage">
  <div class="ambient" aria-hidden="true"></div>
  <div class="dev-wrap" id="devWrap">
    <div class="device" id="device">
      <div class="screen is-cam" id="screen">
        <div class="statusbar" aria-hidden="true">
          <span>9:41</span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
// 原文：~ 开头 = 次要句；含 [n:] 的句子 = 关键句。[n:] 否定/禁止，[t:] 时间，[i:] 要带的
const DOC = [

  { h: "五、其他" },
  { p: ["~如有任何疑问，请于工作日8:00—17:00拨打咨询电话。", "~本须知最终解释权归本中心所有。"] },

// 要点：ref = 原文中关键词，用来定位原句
const GROUPS = [
  { title: "检查前", items: [

    { ref: "检查前3天", warn: true, when: "检查前 3 天", what: "只吃白粥、面条、蒸蛋，<b>不要</b>吃蔬菜水果" },
    { ref: "20:00", warn: true, when: "前一天 20:00 以后", what: "<b>禁止进食</b>，可以喝少量清水" },
  ]},
  { title: "检查当天", items: [
    { ref: "暂停", warn: true, when: "早上", what: "糖尿病：<b>暂停</b>降糖药和胰岛素；降压药照吃" },
    { ref: "6:00", when: "6:00", what: "2 盒泻药兑 2000 毫升温水，每 15 分钟喝 250 毫升，2 小时内喝完" },
    { ref: "检查前2小时", warn: true, when: "检查前 2 小时", what: "<b>禁止喝水</b>" },
    { ref: "身份证", when: "出门前", what: "带身份证、医保卡和以前的检查报告，提前 30 分钟到" },
  ]},
  { title: "检查后", items: [
    { ref: "不能驾车", warn: true, when: "当天", what: "<b>不能开车</b>，不做高空作业，不签重要文件" },
  ]},
];

// 滑块分段：越过阈值时切换一层排版
const STAGES = [
  { at: 0, name: "原样" },
  { at: 0.001, name: "放大 · 加宽行距" },
  { at: 0.25, name: "换成黑体" },
  { at: 0.5, name: "一句一行 · 分出主次" },
  { at: 0.75, name: "✦ 标出重点", ai: true },
];

const KIND = { n: "neg", t: "time", i: "item" };
const $ = (s) => document.querySelector(s);
const stage = $("#stage"), device = $("#device"), devWrap = $("#devWrap"), screen = $("#screen"), doc = $("#doc"), paper = $("#paper");
const shot = $("#shot"), paneDoc = $("#paneDoc"), paneList = $("#paneList"), docFoot = $("#docFoot");
const level = $("#level"), seg = $("#seg"), btnSpeak = $("#btnSpeak"), flash = $("#flash"), sweep = $("#sweep");
const island = $("#island"), islIn = $("#islIn"), islTitle = $("#islTitle"), islSub = $("#islSub"), islRight = $("#islRight");
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PHONE = matchMedia("(max-width: 500px)");
const D = (s) => (RM ? 0.01 : s);
gsap.registerPlugin(Flip);

// ---------- 分词与渲染 ----------
const seger = "Segmenter" in Intl ? new Intl.Segmenter("zh", { granularity: "word" }) : null;
const segments = (str) => seger ? [...seger.segment(str)]
  : [...str].map((c) => ({ segment: c, isWordLike: /[\p{L}\p{N}]/u.test(c) }));
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function sentence(raw) {
  const lo = raw.startsWith("~");
  if (lo) raw = raw.slice(1);
  const key = raw.includes("[n:");
  const toks = [];
  let pre = "";
  // 标点并入前一个词（避免出现在行首），左括号并入后一个词
  const plain = (str) => {
    for (const { segment: s, isWordLike } of segments(str)) {
      if (!isWordLike) {
        if (/^[（《“「(]+$/.test(s)) { pre += s; continue; }
        if (toks.length) { toks[toks.length - 1].tail += s; continue; }
      }
      toks.push({ pre, text: s, kind: "", tail: "" });
      pre = "";
    }
  };
  const re = /\[(n|t|i):([^\]]+)\]/g;
  let last = 0, m;
  while ((m = re.exec(raw))) {
    plain(raw.slice(last, m.index));
    toks.push({ pre, text: m[2], kind: KIND[m[1]], tail: "" });
    pre = "";
    last = re.lastIndex;
  }
  plain(raw.slice(last));
  const html = toks.map((t) => t.kind
    ? `<span class="w k ${t.kind}">${esc(t.pre)}<span class="mk">${esc(t.text)}</span>${esc(t.tail)}</span>`
    : `<span class="w">${esc(t.pre + t.text + t.tail)}</span>`).join("");
  return `<span class="s${lo ? " lo" : ""}${key ? " key" : ""}">${html}</span>`;
}

let words = [], xTo = [], yTo = [];
function render() {
  let head = "", body = "";
  for (const b of DOC) {
    if (b.org) head += `<p class="d-org">${sentence("~" + b.org)}</p>`;
    else if (b.title) head += `<h1 class="d-title">${sentence(b.title)}</h1>`;
    else if (b.h) body += `<h2 class="d-h">${sentence(b.h)}</h2>`;
    else body += `<p class="d-p">${b.p.map(sentence).join("")}</p>`;
  }
  doc.innerHTML = `<header class="d-head">${head}</header>${body}`;
  words = [...doc.querySelectorAll(".w")];
  xTo = words.map((w) => gsap.quickTo(w, "x", { duration: 0.42, ease: "power3.out" }));
  yTo = words.map((w) => gsap.quickTo(w, "y", { duration: 0.42, ease: "power3.out" }));

  const warnIcon = '<span class="ic" aria-hidden="true">!</span>';
  const timeIcon = '<span class="ic" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.3 1.5"/></svg></span>';
  const chev = '<svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>';
  $("#groups").innerHTML = GROUPS.map((g) =>
    `<h3 class="group-h">${g.title}</h3><div class="group">` +
    g.items.map((it) => `<button type="button" class="row${it.warn ? " warn" : ""}" data-ref="${it.ref}">` +
      `${it.warn ? warnIcon : timeIcon}<span><span class="when">${it.when}</span><span class="what">${it.what}</span></span>${chev}</button>`).join("") +
    `</div>`).join("");
}
const findSentence = (ref) => [...doc.querySelectorAll(".mk")].find((e) => e.textContent === ref)?.closest(".s");

// ---------- 设备缩放 ----------
let S = 1;
function fit() {
  if (PHONE.matches) { S = 1; devWrap.style.width = devWrap.style.height = ""; device.style.transform = ""; return; }
  const W = 393 + 22, H = 852 + 22;
  S = Math.min(1, (innerHeight - 80) / H, (innerWidth - 32) / W);
  device.style.transform = `scale(${S})`;
  devWrap.style.width = W * S + "px";
  devWrap.style.height = H * S + "px";
}
addEventListener("resize", fit);
PHONE.addEventListener?.("change", fit);

// ---------- Apple Intelligence 时刻：灵动岛、边缘光、扫光 ----------
const ICON_DONE = '<span class="done-ic"><svg width="13" height="11" viewBox="0 0 13 11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 5.8 3.4 3.4L11.5 1.8"/></svg></span>';
function islandText(title, sub, done) {
  gsap.to([islTitle, islSub], { opacity: 0, duration: D(0.14), onComplete: () => {
    islTitle.textContent = title;
    islSub.textContent = sub;
    islRight.innerHTML = done ? ICON_DONE : '<span class="spin"></span>';
    gsap.to([islTitle, islSub], { opacity: 1, duration: D(0.2) });
  }});
}
function islandOpen() {
  const w = Math.min(365, screen.clientWidth - 16);
  island.classList.add("live");
  gsap.to(island, { width: w, height: 78, borderRadius: 39, marginLeft: -w / 2, duration: D(0.6), ease: "back.out(1.3)" });
  gsap.to(islIn, { opacity: 1, duration: D(0.25), delay: D(0.2) });
}
function islandClose() {
  gsap.to(islIn, { opacity: 0, duration: D(0.15) });
  gsap.to(island, { width: 124, height: 36, borderRadius: 20, marginLeft: -62, duration: D(0.5), ease: "back.out(1.1)", delay: D(0.08),
    onComplete: () => island.classList.remove("live") });
}
function glow(on) {
  screen.classList.toggle("ai-on", on);
  stage.classList.toggle("glowing", on);
}
function lightSweep(dur) {
  const top = paneDoc.offsetTop + parseFloat(getComputedStyle(paneDoc).paddingTop) - 260;
  const bottom = screen.clientHeight - 90;
  return gsap.fromTo(sweep, { y: top, autoAlpha: 1 }, { y: bottom, duration: D(dur), ease: "power1.inOut",
    onComplete: () => gsap.set(sweep, { autoAlpha: 0 }) });
}
function showFound() {
  const negs = [...doc.querySelectorAll(".k.neg .mk")];
  negs.forEach((m, i) => {
    gsap.delayedCall(D(i * 0.12), () => m.classList.add("found"));
    gsap.delayedCall(D(1.6 + i * 0.12), () => m.classList.remove("found"));
  });
}
let anaTl = null;
function analyze() {
  const nNeg = doc.querySelectorAll(".k.neg").length, nTime = doc.querySelectorAll(".k.time").length;
  islTitle.textContent = "正在识别文字";
  islSub.textContent = "读取纸上的内容";
  islRight.innerHTML = '<span class="spin"></span>';
  anaTl = gsap.timeline()
    .add(islandOpen, D(0.1))
    .add(() => glow(true), D(0.4))
    .add(() => islandText("正在理解内容", "找出禁止事项和时间"), D(1.0))
    .add(() => lightSweep(1.5), D(0.95))
    .add(() => { islandText(`找到 ${nNeg} 项禁止事项`, `${nTime} 个时间点 · 拖动下方滑块查看`, true); showFound(); glow(false); }, D(2.55))
    .add(islandClose, D(4.8));
}
function stopAnalysis() {
  anaTl?.kill();
  anaTl = null;
  gsap.killTweensOf([island, islIn, islTitle, islSub, sweep]);
  gsap.set(island, { width: 124, height: 36, borderRadius: 20, marginLeft: -62 });
  gsap.set(islIn, { opacity: 0 });
  gsap.set(sweep, { autoAlpha: 0 });
  island.classList.remove("live");
  doc.querySelectorAll(".found").forEach((m) => m.classList.remove("found"));
  glow(false);
}

// ---------- 排版随滑块变化：每个词从旧位置滑到新位置 ----------
let reading = false, tNow = 0, marksOn = false, lastPop = 0;
function glide(change) {
  if (!reading || RM) { change(); return; }
  const before = words.map((w) => w.getBoundingClientRect());
  const cur = words.map((w) => [gsap.getProperty(w, "x"), gsap.getProperty(w, "y")]);
  change();
  words.forEach((w, i) => {
    const a = w.getBoundingClientRect();
    const dx = (before[i].left - a.left) / S + cur[i][0];
    const dy = (before[i].top - a.top) / S + cur[i][1];
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) { xTo[i](0, dx); yTo[i](0, dy); }
  });
}

// 跨入「标出重点」时：扫光 + 禁止词弹出
function popMarks() {
  const now = performance.now();
  if (now - lastPop < 1200 || RM) return;
  lastPop = now;
  lightSweep(0.9);
  stage.classList.add("glowing");
  gsap.delayedCall(0.9, () => stage.classList.remove("glowing"));
  gsap.fromTo(doc.querySelectorAll(".k.neg"), { scale: 1.35 }, { scale: 1, duration: 0.7, ease: "back.out(3)", stagger: 0.07, delay: 0.15 });
}

function setT(t) {
  tNow = t;
  const h = Math.min(1, Math.max(0, (t - 0.5) / 0.5));
  const marks = t >= 0.75;
  glide(() => {
    device.style.setProperty("--t", t);
    device.style.setProperty("--h", h);
    doc.classList.toggle("sans", t >= 0.25);
    doc.classList.toggle("lines", t >= 0.5);
    doc.classList.toggle("marks", marks);
  });
  if (marks && !marksOn && reading) popMarks();
  marksOn = marks;
  stage.classList.toggle("ai-layer", marks && reading);
  if (+level.value !== t) level.value = t;
  const st = STAGES.filter((s) => t >= s.at).pop();
  const name = $("#stageName");
  name.textContent = st.name;
  name.classList.toggle("ai", !!st.ai);
  $("#sizeOut").textContent = `字号 ${Math.round(13 + 7 * t)}`;
}
let pending = null;
level.addEventListener("input", () => {
  if (pending === null) requestAnimationFrame(() => { setT(pending); pending = null; });
  pending = +level.value;
});

// ---------- 相机 ⇄ 阅读 ----------
let busy = false;
function capture() {
  if (busy || reading) return;
  busy = true;
  gsap.fromTo(flash, { opacity: 0.85 }, { opacity: 0, duration: D(0.45), ease: "power2.out" });
  const state = Flip.getState(paper);
  paneDoc.insertBefore(paper, docFoot);
  paper.classList.remove("photo");
  screen.classList.replace("is-cam", "is-reader");
  Flip.from(state, {
    duration: D(0.75), ease: "expo.out", scale: true,
    onComplete: () => { reading = true; busy = false; },
  });
  analyze();
}
function backToCamera() {
  if (busy || !reading) return;
  busy = true;
  stopSpeak();
  stopAnalysis();
  gsap.killTweensOf(tState);
  switchTab(0);
  reading = false;
  words.forEach((w, i) => { xTo[i](0, 0); yTo[i](0, 0); });
  gsap.set(words, { scale: 1 });
  setT(0);
  paneDoc.scrollTop = 0;
  const state = Flip.getState(paper);
  shot.appendChild(paper);
  paper.classList.add("photo");
  screen.classList.replace("is-reader", "is-cam");
  Flip.from(state, { duration: D(0.6), ease: "expo.inOut", scale: true, onComplete: () => { busy = false; } });
}

// ---------- 原文 / 要点 ----------
let tab = 0;
function switchTab(i) {
  if (i === tab) return;
  stopSpeak();
  tab = i;
  seg.dataset.i = i;
  seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", +b.dataset.i === i));
  paneDoc.setAttribute("aria-hidden", i !== 0);
  paneList.setAttribute("aria-hidden", i !== 1);
  if (i === 1 && !RM) gsap.fromTo(paneList.querySelectorAll(".list-title, .list-sub, .group-h, .row"),
    { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, stagger: 0.03, ease: "power3.out", clearProps: "transform,opacity" });
}
seg.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) switchTab(+b.dataset.i); });
$("#groups").addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (!row) return;
  switchTab(0);
  const s = findSentence(row.dataset.ref);
  if (!s) return;
  s.classList.add("show");
  setTimeout(() => {
    s.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "center" });
    s.classList.remove("ping"); void s.offsetWidth; s.classList.add("ping");
  }, 120);
});
doc.addEventListener("click", (e) => {
  const s = e.target.closest(".s.lo");
  if (s && reading && doc.classList.contains("lines")) s.classList.toggle("show");
});

// ---------- 朗读 ----------
const ICON_SPEAK = '<svg width="24" height="20" viewBox="0 0 24 20" fill="currentColor"><path d="M10.5 1.6 5.6 5.8H2.2C1.5 5.8 1 6.3 1 7v6c0 .7.5 1.2 1.2 1.2h3.4l4.9 4.2c.6.5 1.5.1 1.5-.7V2.3c0-.8-.9-1.2-1.5-.7Z"/><path d="M15.2 6.2a5.3 5.3 0 0 1 0 7.6M18.3 3.4a9.4 9.4 0 0 1 0 13.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const ICON_STOP = '<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="4" width="12" height="12" rx="2.5"/></svg>';
btnSpeak.innerHTML = ICON_SPEAK;
let speakTok = 0, speaking = false;
function speak() {
  if (!("speechSynthesis" in window)) return;
  if (speaking) { stopSpeak(); return; }
  const tok = ++speakTok;
  speaking = true;
  btnSpeak.innerHTML = ICON_STOP;
  btnSpeak.setAttribute("aria-label", "停止朗读");
  const els = tab === 0 ? [...doc.querySelectorAll(".s")].filter((s) => !s.classList.contains("lo")) : [...paneList.querySelectorAll(".row")];
  const cls = tab === 0 ? "reading" : "speaking";
  els.forEach((el, i) => {
    const text = tab === 0 ? el.textContent : el.querySelector(".when").textContent + "。" + el.querySelector(".what").textContent;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.9;
    u.onstart = () => {
      if (tok !== speakTok) return;
      els.forEach((x) => x.classList.toggle(cls, x === el));
      el.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "center" });
    };
    if (i === els.length - 1) u.onend = () => tok === speakTok && stopSpeak();
    speechSynthesis.speak(u);
  });
}
function stopSpeak() {
  speakTok++;
  speaking = false;
  try { speechSynthesis.cancel(); } catch (e) {}
  btnSpeak.innerHTML = ICON_SPEAK;
  btnSpeak.setAttribute("aria-label", "朗读");
  document.querySelectorAll(".reading, .speaking").forEach((x) => x.classList.remove("reading", "speaking"));
}
btnSpeak.addEventListener("click", speak);

// ---------- 键盘与按钮 ----------
$("#shutter").addEventListener("click", capture);
$("#btnBack").addEventListener("click", backToCamera);
const tState = { t: 0 };
function animateT(to, dur = 0.6) {
  tState.t = tNow;
  gsap.to(tState, { t: to, duration: D(dur), ease: "power2.inOut", overwrite: true, onUpdate: () => setT(tState.t) });
}
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onControl = e.target.closest("button, input");
  const k = e.key;
  if (!reading && (k === " " || k === "Enter") && !onControl) { e.preventDefault(); capture(); }
  else if (reading && (k === "ArrowRight" || k === "ArrowLeft") && e.target !== level) {
    e.preventDefault();
    animateT(Math.min(1, Math.max(0, Math.round((tNow + (k === "ArrowRight" ? 0.25 : -0.25)) * 4) / 4)));
  }
  else if (k === "r" || k === "R" || k === "Escape") backToCamera();
  else if (reading && (k === "s" || k === "S")) speak();
  else if (reading && (k === "1" || k === "2")) switchTab(+k - 1);
});

render();
fit();
setT(0);
if (location.hash === "#auto") {
  setTimeout(capture, 900);
  setTimeout(() => animateT(1, 4.5), 6200);
}
</script>
